<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>zAI ERP</title>
    <script>
      // SPA fallback for GitHub Pages: rewrite /app/<path> to /app/?/<path>
      // so index.html can boot and React Router can take over.
      (function () {
        var segmentCount = 1; // /app/ is the only path segment to keep
        var l = window.location;
        l.replace(
          l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + segmentCount).join("/") + "/?/" +
          l.pathname.slice(1).split("/").slice(segmentCount).join("/").replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
